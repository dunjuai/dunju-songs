<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DunjuPlayer - Web Music Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
              400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
              800: '#5b21b6', 900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #ddd6fe; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#f4f3fb] text-slate-800 flex h-screen overflow-hidden select-none">

  <!-- Mandatory Auth Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-purple-100 relative">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white shadow-md shadow-brand-500/30">
          <i class="fa-solid fa-music text-lg"></i>
        </div>
        <span class="font-extrabold text-xl tracking-tight text-slate-800">Dunju<span class="text-brand-600">Player</span></span>
      </div>

      <h2 id="authTitle" class="text-xl sm:text-2xl font-black text-slate-800">Sign In to Continue</h2>
      <p id="authSubtitle" class="text-xs text-slate-400 font-semibold mt-1 mb-6">Enter your credentials to stream your music</p>

      <div class="flex gap-2 p-1 bg-purple-50 rounded-xl mb-6">
        <button id="tabLogin" onclick="switchAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-brand-600 shadow-sm transition">Sign In</button>
        <button id="tabRegister" onclick="switchAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-brand-600 transition">Sign Up</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
          <input id="authUsername" type="text" required placeholder="Enter username" class="w-full px-4 py-2.5 rounded-xl border border-purple-100 bg-purple-50/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input id="authPassword" type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-purple-100 bg-purple-50/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40">
        </div>

        <div id="authError" class="hidden text-xs font-semibold text-rose-500 bg-rose-50 p-2.5 rounded-xl"></div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md shadow-brand-500/25 transition">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Add to Playlist Picker Modal -->
  <div id="playlistPickerModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-purple-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-extrabold text-base text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-brand-600"></i> Add to Playlist
        </h3>
        <button onclick="closePlaylistPicker()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <p id="pickerTrackTitle" class="text-xs text-slate-400 font-bold truncate mb-4"></p>
      
      <div id="pickerPlaylistList" class="space-y-2 max-h-60 overflow-y-auto custom-scroll mb-4"></div>

      <div class="pt-3 border-t border-purple-50 flex items-center gap-2">
        <input id="pickerNewPlName" type="text" placeholder="Or create new playlist..." class="flex-1 px-3 py-2 rounded-xl border border-purple-100 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500/40">
        <button onclick="pickerCreateAndAdd()" class="px-3 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold transition">Create & Add</button>
      </div>
    </div>
  </div>

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 hidden md:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-purple-100 flex flex-col justify-between transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out flex-shrink-0">
    <div class="p-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white shadow-md shadow-brand-500/30">
            <i class="fa-solid fa-music text-lg"></i>
          </div>
          <span class="font-extrabold text-xl tracking-tight text-slate-800">Dunju<span class="text-brand-600">Player</span></span>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-700 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Mobile Profile & Log Out Header inside Drawer -->
      <div class="flex md:hidden items-center justify-between mt-6 p-3 bg-purple-50/60 rounded-2xl border border-purple-100/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs" id="mobUserAvatar">?</div>
          <span class="text-xs font-bold text-slate-700 truncate max-w-[90px]" id="mobUserNameLabel">Guest</span>
        </div>
        <button onclick="logout(); toggleSidebar(false);" class="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold hover:bg-rose-100 transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-right-from-bracket text-[10px]"></i> Log out
        </button>
      </div>

      <nav class="mt-6 md:mt-8 space-y-1 text-sm font-semibold">
        <button onclick="navigate('home'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="home">
          <i class="fa-solid fa-house w-5 text-center text-slate-400"></i> Home
        </button>
        <button onclick="navigate('library'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="library">
          <i class="fa-solid fa-music w-5 text-center text-slate-400"></i> Library
        </button>
        <button onclick="navigate('nowplaying'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="nowplaying">
          <i class="fa-solid fa-circle-play w-5 text-center text-brand-600"></i> Now Playing
        </button>
        <button onclick="navigate('favorites'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="favorites">
          <i class="fa-solid fa-heart w-5 text-center text-rose-500"></i> Favorites
        </button>
        <button onclick="navigate('mostplayed'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="mostplayed">
          <i class="fa-solid fa-fire w-5 text-center text-amber-500"></i> Most Played
        </button>
        <button onclick="navigate('playlists'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="playlists">
          <i class="fa-solid fa-list-ul w-5 text-center text-indigo-500"></i> Playlists
        </button>
        <button onclick="navigate('folders'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="folders">
          <i class="fa-solid fa-folder w-5 text-center text-amber-400"></i> Folder View
        </button>
        <button onclick="navigate('settings'); toggleSidebar(false);" class="nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600" data-page="settings">
          <i class="fa-solid fa-gear w-5 text-center text-slate-400"></i> Settings
        </button>
      </nav>
    </div>

    <!-- Live Status Badge -->
    <div class="p-6 border-t border-purple-50 flex items-center justify-between text-xs text-slate-400">
      <span id="libCount">0 songs</span>
      <div id="serverStatusBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 font-bold transition">
        <span id="serverDot" class="w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-emerald-200"></span>
        <span id="serverStatusText">Live</span>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden bg-[#faf9fe]">
    <!-- Top Bar -->
    <header class="h-16 px-4 sm:px-8 flex items-center justify-between gap-3 border-b border-purple-100/60 bg-white/70 backdrop-blur-md z-10 flex-shrink-0">
      <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2 rounded-lg hover:bg-purple-50 transition">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <div class="relative flex-1 max-w-xl">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
        <input id="searchInput" oninput="handleSearch(this.value)" type="text" placeholder="Search songs, artists, albums... (Ctrl+F)" class="w-full pl-9 sm:pl-11 pr-3 py-1.5 sm:py-2 rounded-xl bg-purple-50/50 border border-purple-100 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40 placeholder-slate-400 transition" />
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button onclick="playSmartSomething()" title="Play community favorites & most played first" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-md shadow-brand-500/25 transition active:scale-95">
          <i class="fa-solid fa-dice"></i> <span class="hidden sm:inline">Play Something</span>
        </button>

        <div class="flex items-center gap-2 pl-2 sm:pl-3 border-l border-purple-100">
          <div class="w-8 h-8 rounded-xl bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs" id="userAvatar">?</div>
          <div class="hidden sm:flex flex-col">
            <span class="text-xs font-bold text-slate-700" id="userNameLabel">Guest</span>
            <button onclick="logout()" class="text-[10px] text-slate-400 hover:text-rose-500 text-left font-semibold">Log out</button>
          </div>
          <button onclick="logout()" class="sm:hidden text-slate-400 hover:text-rose-500 p-1" title="Log out">
            <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Content Container -->
    <div id="contentContainer" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8 pb-40"></div>
  </main>

  <!-- Bottom Player Bar -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-purple-100 px-4 py-3 sm:py-3.5 flex flex-col sm:flex-row items-center justify-between z-30 shadow-lg gap-2 sm:gap-4">
    <!-- Left: Track Info & Album Art -->
    <div class="w-full sm:w-1/4 sm:min-w-[240px] flex items-center justify-between sm:justify-start gap-3">
      <div onclick="navigate('nowplaying')" class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer group">
        <div id="barArtWrapper" class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-700 text-white flex items-center justify-center text-lg shadow flex-shrink-0 overflow-hidden relative">
          <i id="barFallbackIcon" class="fa-solid fa-music"></i>
          <img id="barCoverImg" class="absolute inset-0 w-full h-full object-cover hidden" alt="Cover" />
        </div>
        <div class="min-w-0 flex-1">
          <h4 id="barTitle" class="text-xs sm:text-sm font-bold text-slate-800 truncate group-hover:text-brand-600 transition">No song playing</h4>
          <p id="barArtist" class="text-[10px] sm:text-xs text-slate-400 truncate">Select a song from library</p>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <button onclick="openPlaylistPickerForCurrent()" title="Add to Playlist" class="text-slate-300 hover:text-brand-600 transition p-1">
          <i class="fa-solid fa-list-plus text-base sm:text-lg"></i>
        </button>
        <button onclick="toggleFavCurrent()" id="barFavBtn" class="text-slate-300 hover:text-rose-500 transition p-1">
          <i class="fa-solid fa-heart text-base sm:text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Center: Playback Controls + Scrub Bar -->
    <div class="w-full sm:flex-1 sm:max-w-2xl flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center gap-4 sm:gap-6">
        <button onclick="toggleShuffle()" id="shuffleBtn" title="Shuffle Mode" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition">
          <i class="fa-solid fa-shuffle text-sm"></i>
        </button>

        <button onclick="playPrev()" title="Previous (Left Arrow)" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:text-brand-600 hover:bg-brand-50 transition">
          <i class="fa-solid fa-backward-step text-base"></i>
        </button>

        <button onclick="togglePlay()" id="playPauseBtn" title="Play / Pause (Spacebar)" class="w-11 h-11 rounded-full bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center text-base shadow-md shadow-brand-500/30 transition hover:scale-105 active:scale-95">
          <i class="fa-solid fa-play ml-0.5"></i>
        </button>

        <button onclick="playNext()" title="Next (Right Arrow)" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:text-brand-600 hover:bg-brand-50 transition">
          <i class="fa-solid fa-forward-step text-base"></i>
        </button>

        <button onclick="toggleRepeat()" id="repeatBtn" title="Repeat Mode (Off / All / One)" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition relative">
          <i class="fa-solid fa-repeat text-sm"></i>
          <span id="repeatBadge" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-brand-600 text-white text-[9px] font-black flex items-center justify-center leading-none ring-2 ring-white">1</span>
        </button>
      </div>

      <div class="w-full flex items-center gap-2 sm:gap-3 text-[10px] sm:text-[11px] font-semibold text-slate-400">
        <span id="currentTime">0:00</span>
        <input id="seekSlider" type="range" min="0" max="100" value="0" class="flex-1 h-1.5 bg-purple-100 rounded-lg appearance-none cursor-pointer accent-brand-600">
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <!-- Right: Volume Controls -->
    <div class="hidden sm:flex items-center justify-end gap-2.5 w-1/4 sm:min-w-[200px]">
      <button onclick="adjustVolume(-0.1)" title="Volume Down" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-purple-50 transition text-xs">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button onclick="toggleMute()" id="volIconBtn" title="Mute/Unmute" class="text-slate-500 hover:text-brand-600 transition text-sm p-1">
        <i id="volIcon" class="fa-solid fa-volume-high"></i>
      </button>
      <input id="volSlider" type="range" min="0" max="100" value="80" class="w-20 h-1.5 bg-purple-100 rounded-lg appearance-none cursor-pointer accent-brand-600">
      <button onclick="adjustVolume(0.1)" title="Volume Up" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-purple-50 transition text-xs">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </footer>

  <audio id="audioElement" preload="metadata"></audio>

  <script>
    let config = {
      serverUrl: localStorage.getItem('dunju_server') || 'https://stream.dunjuai.com',
      username: localStorage.getItem('dunju_user') || ''
    };

    let authMode = 'login';
    let library = [];
    let favorites = [];
    let history = [];
    let playCounts = {};
    let playlists = [];

    let isShuffle = false;
    let repeatMode = 0;
    let unplayedShuffleIndices = [];

    let currentTrackIndex = -1;
    let currentPlaylist = [];
    let currentFolderRoute = [];
    let currentPage = 'home';
    let previousVolume = 0.8;

    // Track play completion tracking variables
    let currentSongCompleted = false;
    let activeTrackPath = null;
    let pickerTargetTrack = null;

    const audio = document.getElementById('audioElement');

    window.addEventListener('DOMContentLoaded', () => {
      setupAudioEvents();
      setupKeyboardShortcuts();

      if (!config.username) {
        document.getElementById('authModal').classList.remove('hidden');
        switchAuthMode('login');
      } else {
        document.getElementById('authModal').classList.add('hidden');
        initUserSession(config.username);
      }

      checkServerHealth();
      setInterval(checkServerHealth, 15000);
    });

    function toggleSidebar(forceState) {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebarBackdrop');
      const shouldOpen = forceState !== undefined ? forceState : sb.classList.contains('-translate-x-full');

      if (shouldOpen) {
        sb.classList.remove('-translate-x-full');
        bd.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        bd.classList.add('hidden');
      }
    }

    function getCoverUrl(trackPath) {
      return `${config.serverUrl}/api/cover?path=${encodeURIComponent(trackPath)}`;
    }

    async function checkServerHealth() {
      const badge = document.getElementById('serverStatusBadge');
      const dot = document.getElementById('serverDot');
      const text = document.getElementById('serverStatusText');

      try {
        const res = await fetch(`${config.serverUrl}/api/health`, { cache: 'no-store' });
        if (res.ok) {
          badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 font-bold transition';
          dot.className = 'w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-emerald-200';
          text.innerText = 'Live';
        } else {
          throw new Error();
        }
      } catch (err) {
        badge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-50 text-rose-600 font-bold transition';
        dot.className = 'w-2 h-2 rounded-full bg-rose-500 ring-2 ring-rose-200';
        text.innerText = 'Not Reachable';
      }
    }

    async function playSmartSomething() {
      if (!library.length) return;

      try {
        const res = await fetch(`${config.serverUrl}/api/community-picks`);
        const data = await res.json();
        const priorityPaths = data.priority_paths || [];

        const priorityTracks = priorityPaths.map(p => library.find(s => s.path === p)).filter(Boolean);
        const remainingTracks = library.filter(s => !priorityPaths.includes(s.path));

        for (let i = priorityTracks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [priorityTracks[i], priorityTracks[j]] = [priorityTracks[j], priorityTracks[i]];
        }

        for (let i = remainingTracks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [remainingTracks[i], remainingTracks[j]] = [remainingTracks[j], remainingTracks[i]];
        }

        const smartQueue = [...priorityTracks, ...remainingTracks];
        if (smartQueue.length > 0) {
          playTrack(smartQueue[0], smartQueue);
        }
      } catch (e) {
        const rand = Math.floor(Math.random() * library.length);
        playTrack(library[rand], library);
      }
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const shufBtn = document.getElementById('shuffleBtn');
      if (isShuffle) {
        shufBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-white bg-brand-600 shadow-sm transition';
        initShuffleIndices();
      } else {
        shufBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition';
      }
      if (currentPage === 'nowplaying') renderNowPlaying(document.getElementById('contentContainer'));
    }

    function initShuffleIndices() {
      unplayedShuffleIndices = currentPlaylist.map((_, i) => i).filter(i => i !== currentTrackIndex);
      for (let i = unplayedShuffleIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unplayedShuffleIndices[i], unplayedShuffleIndices[j]] = [unplayedShuffleIndices[j], unplayedShuffleIndices[i]];
      }
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      const repBtn = document.getElementById('repeatBtn');
      const badge = document.getElementById('repeatBadge');

      if (repeatMode === 0) {
        repBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition relative';
        badge.classList.add('hidden');
      } else if (repeatMode === 1) {
        repBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-brand-600 bg-brand-100 transition relative';
        badge.classList.add('hidden');
      } else if (repeatMode === 2) {
        repBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-white bg-brand-600 transition relative';
        badge.classList.remove('hidden');
      }
    }

    function adjustVolume(delta) {
      audio.volume = Math.min(1, Math.max(0, audio.volume + delta));
      document.getElementById('volSlider').value = audio.volume * 100;
      updateVolumeIcon(audio.volume);
    }

    function toggleMute() {
      if (audio.volume > 0) {
        previousVolume = audio.volume;
        audio.volume = 0;
        document.getElementById('volSlider').value = 0;
      } else {
        audio.volume = previousVolume || 0.8;
        document.getElementById('volSlider').value = audio.volume * 100;
      }
      updateVolumeIcon(audio.volume);
    }

    function updateVolumeIcon(vol) {
      const icon = document.getElementById('volIcon');
      if (vol === 0) {
        icon.className = 'fa-solid fa-volume-xmark text-rose-500';
      } else if (vol < 0.5) {
        icon.className = 'fa-solid fa-volume-low';
      } else {
        icon.className = 'fa-solid fa-volume-high';
      }
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const title = document.getElementById('authTitle');
      const sub = document.getElementById('authSubtitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const tabReg = document.getElementById('tabRegister');
      const tabLog = document.getElementById('tabLogin');
      const err = document.getElementById('authError');
      err.classList.add('hidden');

      if (mode === 'register') {
        title.innerText = 'Create an Account';
        sub.innerText = 'Register on your server to sync favorites, history & playlists';
        submitBtn.innerText = 'Create Account';
        tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white text-brand-600 shadow-sm transition';
        tabLog.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-brand-600 transition';
      } else {
        title.innerText = 'Sign In to Continue';
        sub.innerText = 'Enter your credentials to stream your music';
        submitBtn.innerText = 'Sign In';
        tabLog.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white text-brand-600 shadow-sm transition';
        tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-brand-600 transition';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('authUsername').value.trim();
      const p = document.getElementById('authPassword').value;
      const err = document.getElementById('authError');
      const endpoint = authMode === 'register' ? '/api/register' : '/api/login';

      try {
        const res = await fetch(`${config.serverUrl}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (!res.ok) {
          err.innerText = data.error || 'Authentication failed';
          err.classList.remove('hidden');
          return;
        }

        config.username = u;
        localStorage.setItem('dunju_user', u);

        if (authMode === 'login') {
          favorites = data.favorites || [];
          history = data.history || [];
          playCounts = data.play_counts || {};
          playlists = data.playlists || [];
          persistLocalUserData();
        }

        document.getElementById('authModal').classList.add('hidden');
        initUserSession(u);
      } catch (ex) {
        err.innerText = 'Cannot reach stream.dunjuai.com';
        err.classList.remove('hidden');
      }
    }

    // Save user state to local cache
    function persistLocalUserData() {
      if (!config.username) return;
      localStorage.setItem(`dunju_userdata_${config.username}`, JSON.stringify({
        favorites,
        history,
        playCounts,
        playlists
      }));
    }

    // Load and restore user session from local cache & server
    function initUserSession(user) {
      document.getElementById('userNameLabel').innerText = user;
      document.getElementById('userAvatar').innerText = user[0].toUpperCase();
      document.getElementById('mobUserNameLabel').innerText = user;
      document.getElementById('mobUserAvatar').innerText = user[0].toUpperCase();

      // 1. Immediately restore from local cache to prevent empty data
      const cachedUserData = localStorage.getItem(`dunju_userdata_${user}`);
      if (cachedUserData) {
        try {
          const parsed = JSON.parse(cachedUserData);
          favorites = parsed.favorites || [];
          history = parsed.history || [];
          playCounts = parsed.playCounts || {};
          playlists = parsed.playlists || [];
        } catch (e) {}
      }

      // 2. Load cached catalog
      const cachedLib = localStorage.getItem('dunju_library_cache');
      if (cachedLib) {
        library = JSON.parse(cachedLib);
        currentPlaylist = [...library];
        document.getElementById('libCount').innerText = `${library.length} songs`;
      }

      navigate(currentPage || 'home');
      fetchServerLibrary();

      // 3. Simultaneously fetch latest server record to stay synced
      fetch(`${config.serverUrl}/api/user-data?username=${encodeURIComponent(user)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.username === user) {
            favorites = data.favorites || [];
            history = data.history || [];
            playCounts = data.play_counts || {};
            playlists = data.playlists || [];
            persistLocalUserData();
            // Refresh current screen with server updates
            if (['mostplayed', 'favorites', 'playlists'].includes(currentPage)) {
              navigate(currentPage);
            }
          }
        })
        .catch(() => {});
    }

    function logout() {
      localStorage.removeItem('dunju_user');
      config.username = '';
      favorites = [];
      history = [];
      playCounts = {};
      playlists = [];
      audio.pause();
      document.getElementById('authModal').classList.remove('hidden');
      switchAuthMode('login');
    }

    async function fetchServerLibrary() {
      try {
        const res = await fetch(`${config.serverUrl}/api/library`);
        if (!res.ok) throw new Error('Network error');
        library = await res.json();
        currentPlaylist = [...library];
        localStorage.setItem('dunju_library_cache', JSON.stringify(library));
        document.getElementById('libCount').innerText = `${library.length} songs`;
        checkServerHealth();
      } catch (e) {
        checkServerHealth();
      }
    }

    // Playback Engine with Verified Completion Tracking
    function playTrack(track, playlist = null) {
      if (playlist) {
        currentPlaylist = playlist;
        if (isShuffle) initShuffleIndices();
      }
      currentTrackIndex = currentPlaylist.findIndex(t => t.path === track.path);

      currentSongCompleted = false;
      activeTrackPath = track.path;

      history = history.filter(p => p !== track.path);
      history.unshift(track.path);
      if (history.length > 50) history.pop();
      syncUserData();

      const streamUrl = `${config.serverUrl}/${track.path.split('/').map(encodeURIComponent).join('/')}`;
      audio.src = streamUrl;
      audio.play().then(() => {
        updateBarInfo(track);
        if (currentPage === 'nowplaying') {
          renderNowPlaying(document.getElementById('contentContainer'));
        }
      }).catch(err => {
        console.error("Playback error:", streamUrl, err);
      });
    }

    // Increments count ONLY once per track after verified listen (>= 85% or natural end)
    function triggerVerifiedPlayCount(path) {
      if (currentSongCompleted || activeTrackPath !== path) return;
      currentSongCompleted = true;

      playCounts[path] = (playCounts[path] || 0) + 1;
      syncUserData();

      if (currentPage === 'mostplayed') {
        renderMostPlayed(document.getElementById('contentContainer'));
      }
      if (currentPage === 'nowplaying') {
        renderNowPlaying(document.getElementById('contentContainer'));
      }
    }

    function syncUserData() {
      if (!config.username) return;
      persistLocalUserData();
      fetch(`${config.serverUrl}/api/sync`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: config.username,
          favorites: favorites,
          history: history,
          play_counts: playCounts,
          playlists: playlists
        })
      }).catch(() => {});
    }

    function togglePlay() {
      if (!audio.src) {
        if (library.length > 0) playTrack(library[0]);
        return;
      }
      const icon = audio.paused ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play ml-0.5"></i>';
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      document.getElementById('playPauseBtn').innerHTML = icon;
    }

    function playNext() {
      if (!currentPlaylist.length) return;

      if (repeatMode === 2) {
        audio.currentTime = 0;
        audio.play();
        return;
      }

      if (isShuffle) {
        if (unplayedShuffleIndices.length === 0) {
          if (repeatMode === 1) {
            initShuffleIndices();
          } else {
            return;
          }
        }
        currentTrackIndex = unplayedShuffleIndices.pop();
        playTrack(currentPlaylist[currentTrackIndex]);
        return;
      }

      if (currentTrackIndex + 1 >= currentPlaylist.length) {
        if (repeatMode === 1) {
          currentTrackIndex = 0;
          playTrack(currentPlaylist[0]);
        }
        return;
      }
      currentTrackIndex++;
      playTrack(currentPlaylist[currentTrackIndex]);
    }

    function playPrev() {
      if (!currentPlaylist.length) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      currentTrackIndex = (currentTrackIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      playTrack(currentPlaylist[currentTrackIndex]);
    }

    function updateBarInfo(track) {
      document.getElementById('barTitle').innerText = track.title;
      document.getElementById('barArtist').innerText = `${track.director} • ${track.album}`;
      document.getElementById('playPauseBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';

      const isFav = favorites.includes(track.path);
      document.getElementById('barFavBtn').className = isFav ? 'text-rose-500 transition p-1' : 'text-slate-300 hover:text-rose-500 transition p-1';

      const barCoverImg = document.getElementById('barCoverImg');
      const barFallback = document.getElementById('barFallbackIcon');
      barCoverImg.src = getCoverUrl(track.path);
      barCoverImg.onload = () => {
        barCoverImg.classList.remove('hidden');
        barFallback.classList.add('hidden');
      };
      barCoverImg.onerror = () => {
        barCoverImg.classList.add('hidden');
        barFallback.classList.remove('hidden');
      };
    }

    function toggleFavCurrent() {
      if (currentTrackIndex === -1) return;
      const track = currentPlaylist[currentTrackIndex];
      toggleFav(track.path);
      const isFav = favorites.includes(track.path);
      document.getElementById('barFavBtn').className = isFav ? 'text-rose-500 transition p-1' : 'text-slate-300 hover:text-rose-500 transition p-1';
      if (currentPage === 'nowplaying') {
        renderNowPlaying(document.getElementById('contentContainer'));
      }
    }

    function toggleFav(path) {
      if (favorites.includes(path)) {
        favorites = favorites.filter(p => p !== path);
      } else {
        favorites.push(path);
      }
      syncUserData();
    }

    function setupAudioEvents() {
      const seek = document.getElementById('seekSlider');
      const cur = document.getElementById('currentTime');
      const tot = document.getElementById('totalDuration');
      const vol = document.getElementById('volSlider');

      audio.ontimeupdate = () => {
        if (!audio.duration) return;
        seek.value = (audio.currentTime / audio.duration) * 100;
        cur.innerText = formatTime(audio.currentTime);
        tot.innerText = formatTime(audio.duration);

        // Verified listen: passes 85% mark
        if (!currentSongCompleted && activeTrackPath && (audio.currentTime / audio.duration >= 0.85)) {
          triggerVerifiedPlayCount(activeTrackPath);
        }

        const npCur = document.getElementById('npCurrentTime');
        const npTot = document.getElementById('npTotalTime');
        const npBar = document.getElementById('npProgressBar');
        if (npCur && npTot && npBar) {
          npCur.innerText = formatTime(audio.currentTime);
          npTot.innerText = formatTime(audio.duration);
          npBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        }
      };

      seek.oninput = () => {
        if (!audio.duration) return;
        audio.currentTime = (seek.value / 100) * audio.duration;
      };

      if (vol) {
        vol.oninput = () => {
          audio.volume = vol.value / 100;
          updateVolumeIcon(audio.volume);
        };
      }

      // Song completed naturally
      audio.onended = () => {
        if (!currentSongCompleted && activeTrackPath) {
          triggerVerifiedPlayCount(activeTrackPath);
        }
        playNext();
      };
    }

    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          adjustVolume(0.05);
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          adjustVolume(-0.05);
        } else if (e.code === 'KeyM') {
          toggleMute();
        } else if (e.code === 'KeyS') {
          toggleShuffle();
        } else if (e.code === 'KeyR') {
          toggleRepeat();
        }
      });
    }

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function handleSearch(query) {
      query = query.toLowerCase().trim();
      if (!query) {
        navigate('home');
        return;
      }
      const filtered = library.filter(s =>
        s.title.toLowerCase().includes(query) ||
        s.director.toLowerCase().includes(query) ||
        s.album.toLowerCase().includes(query)
      );
      renderSongList(document.getElementById('contentContainer'), filtered, `Search: "${query}"`);
    }

    // Playlist Picker Logic
    function openPlaylistPicker(track) {
      pickerTargetTrack = track;
      document.getElementById('pickerTrackTitle').innerText = track.title;
      renderPickerPlaylists();
      document.getElementById('playlistPickerModal').classList.remove('hidden');
    }

    function openPlaylistPickerForCurrent() {
      if (currentTrackIndex === -1 && library.length > 0) currentTrackIndex = 0;
      const track = currentPlaylist[currentTrackIndex] || library[0];
      if (track) openPlaylistPicker(track);
    }

    function closePlaylistPicker() {
      document.getElementById('playlistPickerModal').classList.add('hidden');
      pickerTargetTrack = null;
    }

    function renderPickerPlaylists() {
      const container = document.getElementById('pickerPlaylistList');
      if (!playlists.length) {
        container.innerHTML = '<p class="text-[11px] text-slate-400 p-2 text-center">No playlists created yet. Type a name below to create your first one!</p>';
        return;
      }

      container.innerHTML = playlists.map(pl => {
        const alreadyIn = pl.songs.includes(pickerTargetTrack.path);
        return `
          <div onclick="toggleTrackInPlaylist('${pl.id}', '${pickerTargetTrack.path}')" class="p-2.5 rounded-xl border border-purple-100 flex items-center justify-between hover:bg-brand-50 cursor-pointer transition">
            <span class="text-xs font-bold text-slate-700 truncate">${pl.name}</span>
            <span class="text-xs ${alreadyIn ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}">
              ${alreadyIn ? '<i class="fa-solid fa-check"></i> Added' : '+ Add'}
            </span>
          </div>
        `;
      }).join('');

    function toggleTrackInPlaylist(plId, path) {
      const pl = playlists.find(p => p.id === plId);
      if (!pl) return;
      if (pl.songs.includes(path)) {
        pl.songs = pl.songs.filter(p => p !== path);
      } else {
        pl.songs.push(path);
      }
      syncUserData();
      renderPickerPlaylists();
      if (currentPage === 'playlists') renderPlaylistsView(document.getElementById('contentContainer'));
    }

    function pickerCreateAndAdd() {
      const input = document.getElementById('pickerNewPlName');
      const name = input.value.trim();
      if (!name) return;

      const newPl = {
        id: 'pl_' + Date.now(),
        name: name,
        songs: pickerTargetTrack ? [pickerTargetTrack.path] : []
      };
      playlists.push(newPl);
      syncUserData();
      input.value = '';
      closePlaylistPicker();
      alert(`Added "${pickerTargetTrack.title}" to "${name}"`);
      if (currentPage === 'playlists') renderPlaylistsView(document.getElementById('contentContainer'));
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if(btn.dataset.page === page) {
          btn.className = 'nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition bg-brand-50 text-brand-600 font-bold';
          btn.querySelector('i').classList.add('text-brand-600');
        } else {
          btn.className = 'nav-btn w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl transition text-slate-600 hover:bg-brand-50 hover:text-brand-600';
          btn.querySelector('i').classList.remove('text-brand-600');
        }
      });

      const container = document.getElementById('contentContainer');
      if (page === 'home') renderHome(container);
      if (page === 'library') renderSongList(container, library, 'All Library Songs');
      if (page === 'nowplaying') renderNowPlaying(container);
      if (page === 'favorites') {
        const favSongs = library.filter(s => favorites.includes(s.path));
        renderSongList(container, favSongs, 'Favorite Tracks');
      }
      if (page === 'mostplayed') renderMostPlayed(container);
      if (page === 'playlists') renderPlaylistsView(container);
      if (page === 'folders') renderFolderView(container);
      if (page === 'settings') renderSettings(container);
    }

    function promptCreatePlaylist() {
      const name = prompt("Enter a name for your new playlist:");
      if (!name || !name.trim()) return;
      const newPl = {
        id: 'pl_' + Date.now(),
        name: name.trim(),
        songs: []
      };
      playlists.push(newPl);
      syncUserData();
      renderPlaylistsView(document.getElementById('contentContainer'));
    }

    function deletePlaylist(plId) {
      if (!confirm("Are you sure you want to delete this playlist?")) return;
      playlists = playlists.filter(p => p.id !== plId);
      syncUserData();
      renderPlaylistsView(document.getElementById('contentContainer'));
    }

    function playEntirePlaylist(plId) {
      const pl = playlists.find(p => p.id === plId);
      if (!pl || !pl.songs.length) {
        alert("This playlist has no songs yet. Click the + icon on any song to add tracks!");
        return;
      }
      const trackObjects = pl.songs.map(p => library.find(s => s.path === p)).filter(Boolean);
      if (trackObjects.length) {
        playTrack(trackObjects[0], trackObjects);
      }
    }

    function viewPlaylistSongs(plId) {
      const pl = playlists.find(p => p.id === plId);
      if (!pl) return;
      const tracks = pl.songs.map(p => library.find(s => s.path === p)).filter(Boolean);
      renderSongList(document.getElementById('contentContainer'), tracks, `Playlist: ${pl.name}`);
    }

        currentTrackIndex = 0;

                  <i class="fa-solid fa-microphone text-brand-500 text-xs"></i> ${track.director}
                </p>
                <p class="text-xs sm:text-sm font-semibold text-slate-400 mt-0.5 flex items-center justify-center md:justify-start gap-2">
                  <i class="fa-solid fa-compact-disc text-slate-300 text-xs"></i> ${track.album} • ${track.language}
                </p>
              </div>

              <div class="space-y-1">
                <div class="w-full bg-purple-100 h-2 rounded-full overflow-hidden cursor-pointer" onclick="seekNowPlaying(event)">
                  <div id="npProgressBar" class="bg-brand-600 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] font-bold text-slate-400">
                  <span id="npCurrentTime">${formatTime(audio.currentTime)}</span>
                  <span id="npTotalTime">${formatTime(audio.duration)}</span>
                </div>
              </div>

              <div class="flex flex-wrap items-center justify-center md:justify-start gap-2.5">
                <button onclick="toggleFavCurrent()" class="px-4 py-2 rounded-xl border border-purple-100 hover:bg-purple-50 text-xs font-bold transition flex items-center gap-2 ${isFav ? 'text-rose-500 bg-rose-50/50' : 'text-slate-600'}">
                  <i class="fa-solid fa-heart ${isFav ? 'text-rose-500' : 'text-slate-400'}"></i> ${isFav ? 'Favorited' : 'Add to Favorites'}
                </button>
                <button onclick="openPlaylistPickerForCurrent()" class="px-4 py-2 rounded-xl border border-purple-100 hover:bg-purple-50 text-xs font-bold text-slate-600 transition flex items-center gap-2">
                  <i class="fa-solid fa-list-plus text-indigo-500"></i> Add to Playlist
                </button>
                <button onclick="openTrackFolder('${track.language}', '${track.director}')" class="px-4 py-2 rounded-xl border border-purple-100 hover:bg-purple-50 text-xs font-bold text-slate-600 transition flex items-center gap-2">
                  <i class="fa-solid fa-folder-open text-amber-500"></i> Open Folder
                </button>
                <button onclick="toggleShuffle()" class="px-4 py-2 rounded-xl border border-purple-100 hover:bg-purple-50 text-xs font-bold transition flex items-center gap-2 ${isShuffle ? 'text-brand-600 bg-brand-50' : 'text-slate-600'}">
                  <i class="fa-solid fa-shuffle ${isShuffle ? 'text-brand-600' : 'text-slate-400'}"></i> Shuffle
                </button>
              </div>

              <div class="pt-4 border-t border-purple-50 grid grid-cols-2 sm:grid-cols-4 gap-4 text-center md:text-left">
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Format</span>
                  <span class="text-xs font-extrabold text-slate-700 uppercase">${track.filename.split('.').pop()}</span>
                </div>
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Verified Plays</span>
                  <span class="text-xs font-extrabold text-slate-700">${plays} times</span>
                </div>
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Channels</span>
                  <span class="text-xs font-extrabold text-slate-700">Stereo</span>
                </div>
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Quality</span>
                  <span class="text-xs font-extrabold text-brand-600">HQ Stream</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function seekNowPlaying(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    }

    function openTrackFolder(lang, dir) {
      currentFolderRoute = [lang, dir];
      navigate('folders');
    }

    function renderHome(container) {
      const recentTracks = history.map(path => library.find(s => s.path === path)).filter(Boolean).slice(0, 4);

      container.innerHTML = `
        <div class="space-y-6 sm:space-y-8">
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-800">Good Day, ${config.username} 👋</h1>
            <p class="text-xs sm:text-sm font-semibold text-slate-400 mt-1">${library.length} songs ready to stream</p>
          </div>

          <div>
            <h3 class="text-xs sm:text-sm font-extrabold text-slate-700 tracking-wider uppercase mb-3 sm:mb-4 flex items-center gap-2">
              <i class="fa-solid fa-rotate-left text-brand-500"></i> Continue Listening
            </h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4">
              ${recentTracks.length ? recentTracks.map(t => `
                <div onclick='playTrack(${JSON.stringify(t)})' class="group p-3 sm:p-4 rounded-2xl bg-white border border-purple-100/70 hover:shadow-xl hover:shadow-brand-500/10 cursor-pointer transition">
                  <div class="aspect-square w-full rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-800 flex items-center justify-center text-white text-2xl sm:text-3xl mb-2 sm:mb-3 shadow overflow-hidden relative">
                    <i class="fa-solid fa-compact-disc group-hover:rotate-45 transition duration-300"></i>
                    <img src="${getCoverUrl(t.path)}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()" />
                  </div>
                  <h4 class="font-bold text-xs sm:text-sm text-slate-800 truncate">${t.title}</h4>
                  <p class="text-[11px] text-slate-400 truncate mt-0.5">${t.director}</p>
                </div>
              `).join('') : '<p class="text-xs text-slate-400 col-span-4">No recent songs. Start playing from Library or Folder View!</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderSongList(container, songs, title) {
      container.innerHTML = `
        <div>
          <h2 class="text-lg sm:text-xl font-black text-slate-800 mb-4 sm:mb-6">${title} (${songs.length})</h2>
          <div class="bg-white rounded-2xl border border-purple-100 overflow-hidden shadow-sm">
            <div class="divide-y divide-purple-50">
              ${songs.map((s, idx) => `
                <div class="p-3 sm:px-6 flex items-center justify-between hover:bg-brand-50/50 group cursor-pointer transition" onclick='playTrack(${JSON.stringify(s)})'>
                  <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                    <span class="text-xs font-bold text-slate-300 group-hover:text-brand-600 w-4 sm:w-5">${idx + 1}</span>
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-brand-100 overflow-hidden relative flex-shrink-0 flex items-center justify-center text-brand-600">
                      <i class="fa-solid fa-music text-xs"></i>
                      <img src="${getCoverUrl(s.path)}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()" />
                    </div>
                    <div class="min-w-0">
                      <h4 class="text-xs sm:text-sm font-bold text-slate-800 truncate">${s.title}</h4>
                      <p class="text-[11px] text-slate-400 truncate">${s.director} •${s.album}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="event.stopPropagation(); openPlaylistPicker(${JSON.stringify(s).replace(/"/g, '&quot;')});" title="Add to Playlist" class="text-slate-300 hover:text-brand-600 p-1">
                      <i class="fa-solid fa-list-plus text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="event.stopPropagation(); toggleFav('${s.path}'); this.querySelector('i').classList.toggle('text-rose-500');" title="Favorite" class="text-slate-300 hover:text-rose-500 p-1">
                      <i class="fa-solid fa-heart text-xs sm:text-sm ${favorites.includes(s.path) ? 'text-rose-500' : ''}"></i>
                    </button>
                    <span class="hidden sm:inline text-xs font-medium text-slate-400">${s.language}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderMostPlayed(container) {
      const sorted = [...library].sort((a,b) => (playCounts[b.path] || 0) - (playCounts[a.path] || 0)).filter(s => (playCounts[s.path] || 0) > 0);

      container.innerHTML = `
        <div>
          <div class="mb-4 sm:mb-6">
            <h2 class="text-lg sm:text-xl font-black text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-fire text-amber-500"></i> Most Played Tracks
            </h2>
            <p class="text-xs text-slate-400 font-semibold mt-1">Tracks count only after verified completion (≥ 85% listened)</p>
          </div>

          <div class="bg-white rounded-2xl border border-purple-100 overflow-hidden shadow-sm">
            ${sorted.length ? sorted.map((s, idx) => `
              <div class="p-3 sm:px-6 flex items-center justify-between hover:bg-brand-50/50 cursor-pointer" onclick='playTrack(${JSON.stringify(s)})'>
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                  <span class="text-xs sm:text-sm font-bold text-brand-600 w-5">#${idx+1}</span>
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-brand-100 overflow-hidden relative flex-shrink-0 flex items-center justify-center text-brand-600">
                    <i class="fa-solid fa-music text-xs"></i>
                    <img src="${getCoverUrl(s.path)}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()" />
                  </div>
                  <div class="min-w-0">
                    <h4 class="text-xs sm:text-sm font-bold text-slate-800 truncate">${s.title}</h4>
                    <p class="text-[11px] text-slate-400 truncate">${s.director} •${s.album}</p>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 text-[11px] font-bold whitespace-nowrap">${playCounts[s.path]} full${playCounts[s.path] === 1 ? 'play' : 'plays'}</span>
                  <button onclick="event.stopPropagation(); openPlaylistPicker(${JSON.stringify(s).replace(/"/g, '&quot;')});" class="text-slate-300 hover:text-brand-600 p-1">
                    <i class="fa-solid fa-list-plus text-xs"></i>
                  </button>
                </div>
              </div>
            `).join('') : '<div class="p-8 text-center text-xs text-slate-400">No tracks completed yet. Fully play a song to see it ranked here!</div>'}
          </div>
        </div>
      `;
    }

    function renderFolderView(container) {
      let levelTracks = library;
      currentFolderRoute.forEach((folder, idx) => {
        if (idx === 0) levelTracks = levelTracks.filter(s => s.language === folder);
        if (idx === 1) levelTracks = levelTracks.filter(s => s.director === folder);
        if (idx === 2) levelTracks = levelTracks.filter(s => s.album === folder);
      });

      let folders = [];
      let songs = [];

      if (currentFolderRoute.length === 0) {
        folders = [...new Set(library.map(s => s.language))].filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      } else if (currentFolderRoute.length === 1) {
        folders = [...new Set(levelTracks.map(s => s.director))].filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      } else if (currentFolderRoute.length === 2) {
        folders = [...new Set(levelTracks.map(s => s.album))].filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      } else {
        songs = [...levelTracks].sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
      }

      container.innerHTML = `
        <div class="space-y-4 sm:space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="text-lg sm:text-xl font-black text-slate-800 flex items-center gap-2"><i class="fa-solid fa-folder text-amber-400"></i> Directory</h2>
              <div class="flex flex-wrap items-center gap-1.5 text-xs font-semibold text-slate-400 mt-1">
                <span class="cursor-pointer hover:text-brand-600" onclick="drillFolder(-1)">Songs</span>
                ${currentFolderRoute.map((f, i) => `
                  <span>/</span>
                  <span class="cursor-pointer hover:text-brand-600 font-bold text-brand-600 truncate max-w-[120px]" onclick="drillFolder(${i})">${f}</span>
                `).join('')}
              </div>
            </div>
            <button onclick="fetchServerLibrary().then(() => renderFolderView(container))" class="self-start sm:self-auto px-3 py-1.5 rounded-xl border border-purple-200 text-xs font-bold text-slate-600 hover:bg-brand-50">Refresh</button>
          </div>

          ${folders.length ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
              ${folders.map(folderName => `
                <div onclick="enterFolder('${folderName.replace(/'/g, "\\'")}')" class="p-3.5 sm:p-4 rounded-2xl bg-white border border-purple-100 hover:border-brand-400 hover:shadow-lg cursor-pointer transition flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg flex-shrink-0">
                    <i class="fa-solid fa-folder"></i>
                  </div>
                  <div class="min-w-0">
                    <h4 class="text-xs sm:text-sm font-bold text-slate-800 truncate">${folderName}</h4>
                    <p class="text-[10px] text-slate-400">Browse &rarr;</p>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          ${songs.length ? `
            <div class="bg-white rounded-2xl border border-purple-100 overflow-hidden divide-y divide-purple-50">
              ${songs.map((s, idx) => `
                <div class="p-3 sm:px-6 flex items-center justify-between hover:bg-brand-50/50 cursor-pointer" onclick='playTrack(${JSON.stringify(s)})'>
                  <div class="flex items-center gap-3 min-w-0">
                    <span class="text-xs font-bold text-slate-300 w-4">${idx+1}</span>
                    <div class="w-8 h-8 rounded-lg bg-brand-100 overflow-hidden relative flex-shrink-0 flex items-center justify-center text-brand-600">
                      <i class="fa-solid fa-music text-[10px]"></i>
                      <img src="${getCoverUrl(s.path)}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()" />
                    </div>
                    <h4 class="text-xs sm:text-sm font-bold text-slate-800 truncate">${s.title}</h4>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="event.stopPropagation(); openPlaylistPicker(${JSON.stringify(s).replace(/"/g, '&quot;')});" class="text-slate-300 hover:text-brand-600 p-1">
                      <i class="fa-solid fa-list-plus text-xs"></i>
                    </button>
                    <i class="fa-solid fa-play text-xs text-brand-600 ml-1"></i>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function enterFolder(name) {
      currentFolderRoute.push(name);
      renderFolderView(document.getElementById('contentContainer'));
    }

    function drillFolder(idx) {
      if (idx === -1) {
        currentFolderRoute = [];
      } else {
        currentFolderRoute = currentFolderRoute.slice(0, idx + 1);
      }
      renderFolderView(document.getElementById('contentContainer'));
    }

    function renderSettings(container) {
      container.innerHTML = `
        <div class="max-w-2xl space-y-6">
          <h2 class="text-lg sm:text-xl font-black text-slate-800">Settings</h2>

          <div class="p-4 sm:p-6 rounded-2xl bg-white border border-purple-100 space-y-4 shadow-sm">
            <h3 class="font-extrabold text-sm text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-server text-brand-600"></i> Server Host Configuration
            </h3>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Cloudflare Stream URL</label>
              <input id="setServerUrl" type="text" value="${config.serverUrl}" class="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
            </div>
            <button onclick="saveSettings()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/20 transition">Save Changes</button>
          </div>

          <div class="p-4 sm:p-6 rounded-2xl bg-white border border-rose-100 space-y-3 shadow-sm">
            <h3 class="font-extrabold text-sm text-rose-600 flex items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i> Clear User Data
            </h3>
            <p class="text-xs text-slate-400">
              This will reset your personal <strong>Most Played counts, Favorites, and Listen History</strong> for <span class="font-bold text-slate-700">${config.username}</span> from both your browser and Ubuntu server. Your playlists will remain safe.
            </p>
            <button onclick="clearUserData()" class="px-4 py-2.5 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold text-xs border border-rose-200 transition">
              <i class="fa-solid fa-trash-can mr-1.5"></i> Clear My Data
            </button>
          </div>
        </div>
      `;
    }

    function saveSettings() {
      const url = document.getElementById('setServerUrl').value.trim();
      config.serverUrl = url;
      localStorage.setItem('dunju_server', url);
      fetchServerLibrary();
      alert('Settings saved!');
    }

    async function clearUserData() {
      if (!confirm(`Are you sure you want to clear your most played, favorites, and history for ${config.username}? This cannot be undone.`)) {
        return;
      }

      favorites = [];
      history = [];
      playCounts = {};
      persistLocalUserData();

      try {
        await fetch(`${config.serverUrl}/api/clear-user-data`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: config.username })
        });
        alert('All statistics, history, and favorites cleared successfully!');
        navigate('home');
      } catch (err) {
        alert('Cleared locally (could not reach server).');
        navigate('home');
      }
    }
  </script>
</body>
</html>
